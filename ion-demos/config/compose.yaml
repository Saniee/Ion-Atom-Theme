# Carrier dashboard services.
name: carrier-dashboard

x-defaults: &defaults
  restart: unless-stopped
  environment:
    TZ: UTC
    LOG_LEVEL: info

services:
  api:
    <<: *defaults
    image: ghcr.io/example/carrier-api:1.4.2
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      retries: 3
    depends_on: [db]
  db:
    <<: *defaults
    image: postgres:17
    volumes:
      - db-data:/var/lib/postgresql/data
    command: >
      postgres -c max_connections=200
               -c shared_buffers=256MB

volumes:
  db-data: {}
enabled: true
max_items: 64
ratio: 0.75
owner: ~
